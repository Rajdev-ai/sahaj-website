<!doctype html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#071d36">
<title>DL PDF Verification | Sahaj Jan Seva Kendra</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#06172b,#102f54);color:#fff;min-height:100vh}.wrap{max-width:620px;margin:auto;padding:24px 16px 50px}.back{display:inline-block;color:#071d36;background:#ffd34e;text-decoration:none;font-weight:900;padding:10px 16px;border-radius:999px;margin-bottom:22px}.card{padding:26px;border-radius:24px;background:rgba(255,255,255,.07);border:1px solid rgba(255,211,78,.3);box-shadow:0 20px 55px rgba(0,0,0,.28)}h1{color:#ffd34e;text-align:center;margin:4px 0 8px}.sub{text-align:center;color:#cbd9e8;margin-bottom:24px}label{display:block;font-weight:800;margin:15px 0 7px}input{width:100%;padding:14px 15px;border-radius:12px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.1);color:#fff;outline:none;font-size:16px}input:focus{border-color:#ffd34e}.btn{width:100%;border:0;cursor:pointer;padding:15px;border-radius:13px;background:#18d36b;color:#071d36;font-weight:900;font-size:16px;margin-top:22px}.note{font-size:12px;color:#9fb2c7;line-height:1.6;margin-top:16px}.success{display:none;margin-top:15px;padding:12px;border-radius:12px;background:rgba(24,211,107,.14);color:#b9ffd6}.brand{text-align:center;color:#9fb2c7;font-size:12px;margin-top:22px}@media(max-width:600px){.card{padding:20px}}
</style>
</head>
<body>
<div class="wrap">
<a class="back" href="/instant-service.html">← Instant Service</a>
<div class="card">
<h1>🪪 DL PDF Verification</h1>
<div class="sub">Details भरें → Submit करें → WhatsApp पर enquiry भेजें</div>
<form id="dlForm">
<label>👤 ग्राहक का नाम</label><input id="name" required placeholder="ग्राहक का नाम">
<label>📱 मोबाइल नंबर</label><input id="mobile" required inputmode="numeric" maxlength="10" pattern="[0-9]{10}" placeholder="10 अंकों का मोबाइल नंबर">
<label>🪪 DL Number</label><input id="dl" required placeholder="जैसे UPXX0000000000000" autocomplete="off">
<label>📅 Date of Birth</label><input id="dob" required type="date">
<button class="btn" type="submit">💬 Submit & WhatsApp भेजें</button>
</form>
<div id="success" class="success">WhatsApp खुल रहा है…</div>
<div class="note">आपकी दी हुई जानकारी सीधे WhatsApp enquiry में जाएगी। यह form केवल service enquiry/processing request भेजने के लिए है।</div>
</div>
<div class="brand">SAHAJ JAN SEVA KENDRA & DIGITAL PHOTO STUDIO • RAJDEV</div>
</div>
<script>
const f=document.getElementById('dlForm');
document.getElementById('mobile').addEventListener('input',e=>e.target.value=e.target.value.replace(/\D/g,'').slice(0,10));
f.addEventListener('submit',e=>{e.preventDefault();const name=document.getElementById('name').value.trim(),mobile=document.getElementById('mobile').value.trim(),dl=document.getElementById('dl').value.trim().toUpperCase(),dob=document.getElementById('dob').value;const msg=`नमस्ते Rajdev ji, मुझे DL PDF Verification service चाहिए।\n\nग्राहक नाम: ${name}\nमोबाइल: ${mobile}\nDL Number: ${dl}\nDOB: ${dob}\n\nकृपया आगे की प्रक्रिया बताएं।`;document.getElementById('success').style.display='block';window.location.href=`https://wa.me/919005714672?text=${encodeURIComponent(msg)}`;});
</script>
</body>
</html>
