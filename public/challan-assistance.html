<!doctype html><html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071d36"><title>Challan Assistance</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#06172b,#12375e);color:#fff;min-height:100vh}.wrap{max-width:760px;margin:auto;padding:22px 16px 45px}.back{display:inline-block;background:#ffd34e;color:#071d36;text-decoration:none;font-weight:900;padding:11px 17px;border-radius:999px;margin-bottom:24px}.box{background:rgba(255,255,255,.08);border:1px solid rgba(255,211,78,.35);border-radius:24px;padding:24px;box-shadow:0 20px 55px rgba(0,0,0,.3)}h1{color:#ffd34e;text-align:center;font-size:30px;margin:8px 0 10px}.sub{text-align:center;color:#cbd9e8;margin-bottom:25px;line-height:1.5}label{display:block;font-weight:800;margin:15px 0 7px}input,select{width:100%;padding:15px;border-radius:13px;border:1px solid #6e9abd;background:rgba(255,255,255,.1);color:#fff;font-size:16px;outline:none}option{color:#111}.consent{display:flex;gap:10px;align-items:flex-start;margin-top:18px;color:#d7e2ee;font-size:13px;line-height:1.45}.consent input{width:auto;margin-top:3px}.btn{width:100%;margin-top:23px;padding:15px;border:0;border-radius:13px;background:#18d36b;color:#071d36;font-size:17px;font-weight:900;cursor:pointer}.note{text-align:center;color:#aebfd0;font-size:12px;margin-top:15px}.brand{text-align:center;color:#9fb2c7;font-size:12px;margin-top:30px}</style></head><body><div class="wrap"><a class="back" href="/instant-service.html">← Instant Service</a><div class="box"><h1>🚘 Challan Assistance</h1><div class="sub">Vehicle challan status/payment assistance के लिए enquiry भेजें।<br>Details भरें → Submit करें → WhatsApp पर enquiry भेजें</div><form id="challanForm"><label>ग्राहक का नाम</label><input id="name" required placeholder="ग्राहक का नाम"><label>मोबाइल नंबर</label><input id="mobile" required inputmode="numeric" maxlength="10" placeholder="10 अंकों का मोबाइल नंबर"><label>गाड़ी का Registration Number</label><input id="vehicle" required placeholder="जैसे UP32AB1234" style="text-transform:uppercase"><label>राज्य / केंद्रशासित प्रदेश</label><select id="state" required><option value="">State चुनें</option><option>Andhra Pradesh</option><option>Arunachal Pradesh</option><option>Assam</option><option>Bihar</option><option>Chhattisgarh</option><option>Goa</option><option>Gujarat</option><option>Haryana</option><option>Himachal Pradesh</option><option>Jharkhand</option><option>Karnataka</option><option>Kerala</option><option>Madhya Pradesh</option><option>Maharashtra</option><option>Manipur</option><option>Meghalaya</option><option>Mizoram</option><option>Nagaland</option><option>Odisha</option><option>Punjab</option><option>Rajasthan</option><option>Sikkim</option><option>Tamil Nadu</option><option>Telangana</option><option>Tripura</option><option>Uttar Pradesh</option><option>Uttarakhand</option><option>West Bengal</option><option>Andaman &amp; Nicobar Islands</option><option>Chandigarh</option><option>Dadra &amp; Nagar Haveli and Daman &amp; Diu</option><option>Delhi (NCT)</option><option>Jammu &amp; Kashmir</option><option>Ladakh</option><option>Lakshadweep</option><option>Puducherry</option></select><label class="consent"><input id="consent" type="checkbox" required><span>मैं सहमत हूँ कि यह केवल vehicle challan assistance/enquiry के लिए है और official/authorized transport system के माध्यम से ही verification/payment किया जाएगा।</span></label><button class="btn" type="submit">💬 Submit & WhatsApp भेजें</button></form><div class="note">Website खुद किसी private database से challan details नहीं निकालती।</div></div><div class="brand">SAHAJ JAN SEVA KENDRA & DIGITAL PHOTO STUDIO • RAJDEV</div></div><script>document.getElementById('challanForm').addEventListener('submit',function(e){e.preventDefault();const n=document.getElementById('name').value.trim(),m=document.getElementById('mobile').value.trim(),v=document.getElementById('vehicle').value.trim().toUpperCase(),s=document.getElementById('state').value;if(!/^[0-9]{10}$/.test(m)){alert('कृपया 10 अंकों का सही मोबाइल नंबर डालें।');return}const text='Namaste Sahaj Jan Seva Kendra, mujhe Vehicle Challan Assistance chahiye.%0A%0ACustomer Name: '+encodeURIComponent(n)+'%0AMobile: '+encodeURIComponent(m)+'%0AVehicle Registration Number: '+encodeURIComponent(v)+'%0AState/UT: '+encodeURIComponent(s)+'%0A%0AConsent: Customer requested challan assistance through official/authorized process.';window.location.href='https://wa.me/919005714672?text='+text});</script></body></html>
